<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Temperature Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a66;
      --border: #e4e2dc; --accent: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161615; --panel: #1f1f1d; --text: #ecebe7; --muted: #9c9a94; --border: #33322f; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    header h1 { font-size: 18px; margin: 0; }
    header a { color: var(--accent); font-size: 14px; }
    .muted { color: var(--muted); font-size: 13px; }
    main { display: grid; grid-template-columns: 1fr 380px; height: calc(100vh - 58px); }
    #map { height: 100%; }
    aside { background: var(--panel); border-left: 1px solid var(--border); padding: 20px; overflow-y: auto; }
    aside h2 { margin: 0 0 4px; font-size: 20px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
    .stat { border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
    .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
    .legend { display: flex; gap: 6px; align-items: center; margin-top: 20px; }
    .legend span { width: 28px; height: 10px; border-radius: 2px; display: inline-block; }
    .error { color: #b91c1c; }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
      aside { border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Temperature Dashboard</h1>
    <span class="muted">Latest reading per city · click a marker for details</span>
    <a href="/docs">API docs →</a>
  </header>
  <main>
    <div id="map" role="region" aria-label="Map of city temperatures"></div>
    <aside id="panel">
      <p class="muted">Select a city on the map.</p>
      <div class="legend" aria-hidden="true">
        <span style="background:#2563eb"></span>&lt;15°
        <span style="background:#16a34a"></span>15–22°
        <span style="background:#eab308"></span>22–28°
        <span style="background:#ea580c"></span>28–34°
        <span style="background:#b91c1c"></span>34°+
      </div>
    </aside>
  </main>

  <script>
    const API = ""; // same origin; set to "http://localhost:8000" if served elsewhere

    function colorFor(t) {
      if (t < 15) return "#2563eb";
      if (t < 22) return "#16a34a";
      if (t < 28) return "#eab308";
      if (t < 34) return "#ea580c";
      return "#b91c1c";
    }

    async function getJSON(path) {
      const res = await fetch(API + path);
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      return res.json();
    }

    const map = L.map("map").setView([28, 38], 5);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    const panel = document.getElementById("panel");
    let chart;

    async function showCity(city) {
      panel.innerHTML = `<h2>${city.city_name}</h2><p class="muted">${city.country} · loading…</p>`;
      try {
        const [readings, stats] = await Promise.all([
          getJSON(`/cities/${city.city_id}/readings?limit=48`),
          getJSON(`/cities/${city.city_id}/stats`),
        ]);
        readings.reverse(); // oldest → newest for the chart

        panel.innerHTML = `
          <h2>${city.city_name}</h2>
          <p class="muted">${city.country} · now ${city.temperature_c.toFixed(1)}°C,
             humidity ${city.humidity ?? "–"}%</p>
          <div class="stats">
            <div class="stat"><span class="muted">Min</span><b>${stats.min_c.toFixed(1)}°</b></div>
            <div class="stat"><span class="muted">Avg</span><b>${stats.avg_c.toFixed(1)}°</b></div>
            <div class="stat"><span class="muted">Max</span><b>${stats.max_c.toFixed(1)}°</b></div>
          </div>
          <p class="muted">Last 48 hours (${stats.count} readings stored in total)</p>
          <canvas id="chart" height="220" aria-label="Temperature over the last 48 hours"></canvas>`;

        if (chart) chart.destroy();
        chart = new Chart(document.getElementById("chart"), {
          type: "line",
          data: {
            labels: readings.map(r => new Date(r.recorded_at).toLocaleString([], { weekday: "short", hour: "2-digit" })),
            datasets: [{ label: "°C", data: readings.map(r => r.temperature_c),
                         borderColor: "#c2410c", pointRadius: 0, tension: 0.3 }],
          },
          options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { maxTicksLimit: 6 } } } },
        });
      } catch (err) {
        panel.innerHTML = `<p class="error">Could not load ${city.city_name}: ${err.message}</p>`;
      }
    }

    getJSON("/map/latest")
      .then(cities => {
        cities.forEach(c => {
          L.circleMarker([c.latitude, c.longitude], {
            radius: 11, color: "#fff", weight: 2, fillColor: colorFor(c.temperature_c), fillOpacity: 0.9,
          })
            .bindTooltip(`${c.city_name}: ${c.temperature_c.toFixed(1)}°C`)
            .on("click", () => showCity(c))
            .addTo(map);
        });
      })
      .catch(err => { panel.innerHTML = `<p class="error">API not reachable: ${err.message}</p>`; });
  </script>
</body>
</html>
